name: medialert-grupo4-vm
services:
  zookeeper1:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper1
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181
    restart: unless-stopped
    networks:
    - medialert
  zookeeper2:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper2
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181
    restart: unless-stopped
    networks:
    - medialert
  zookeeper3:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper3
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: server.1=zookeeper1:2888:3888;2181 server.2=zookeeper2:2888:3888;2181 server.3=zookeeper3:2888:3888;2181
    restart: unless-stopped
    networks:
    - medialert
  kafka1:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka1
    depends_on:
    - zookeeper1
    - zookeeper2
    - zookeeper3
    ports:
    - 127.0.0.1:19092:19092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:19092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
    - medialert
  kafka2:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka2
    depends_on:
    - zookeeper1
    - zookeeper2
    - zookeeper3
    ports:
    - 127.0.0.1:19093:19093
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29093,EXTERNAL://localhost:19093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29093,EXTERNAL://0.0.0.0:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-broker-api-versions --bootstrap-server localhost:29093 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
    - medialert
  kafka3:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka3
    depends_on:
    - zookeeper1
    - zookeeper2
    - zookeeper3
    ports:
    - 127.0.0.1:19094:19094
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29094,EXTERNAL://localhost:19094
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29094,EXTERNAL://0.0.0.0:19094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-broker-api-versions --bootstrap-server localhost:29094 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
    - medialert
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka1:29092
    entrypoint:
    - /bin/bash
    - -ec
    - |
      BOOTSTRAP_SERVER="$${KAFKA_BOOTSTRAP_SERVER:-kafka1:29092}"
      MAX_ATTEMPTS=60
      for i in $$(seq 1 $$MAX_ATTEMPTS); do
        kafka-broker-api-versions --bootstrap-server "$$BOOTSTRAP_SERVER" >/dev/null 2>&1 && break
        echo "[kafka-init] Esperando Kafka ($$i/$$MAX_ATTEMPTS)..."
        sleep 5
      done
      for topic in senales_vitales alertas alertas-medicas resumenes-vitales; do
        kafka-topics --bootstrap-server "$$BOOTSTRAP_SERVER" \
          --create --if-not-exists --topic "$$topic" \
          --partitions 3 --replication-factor 3
        echo "[kafka-init] $$topic listo"
      done
      kafka-topics --bootstrap-server "$$BOOTSTRAP_SERVER" --list
    restart: 'no'
    networks:
    - medialert
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    ports:
    - 8090:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: medialert-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29093,kafka3:29094
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
    restart: unless-stopped
    networks:
    - medialert
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
    - 127.0.0.1:5672:5672
    - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-medialert}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-MedialertRabbit2026}
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
    - medialert
  oracle:
    image: gvenzl/oracle-xe:21-slim
    ports:
    - 127.0.0.1:${ORACLE_HOST_PORT:-1522}:1521
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-Oracle2026Demo}
      APP_USER: ${ORACLE_USER:-MEDIALERT}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-Medialert2026Demo}
    volumes:
    - oracle-data:/opt/oracle/oradata
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped
    networks:
    - medialert
  productor-senales:
    image: ${DOCKERLAB_USER:-j4cobiyo}/productor-senales:${IMAGE_TAG:-3.0.1}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:8081:8081
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka1:29092,kafka2:29093,kafka3:29094}
    restart: unless-stopped
    networks:
    - medialert
  procesador-senales:
    image: ${DOCKERLAB_USER:-j4cobiyo}/procesador-senales:${IMAGE_TAG:-3.0.1}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:8082:8082
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka1:29092,kafka2:29093,kafka3:29094}
    restart: unless-stopped
    networks:
    - medialert
  servicio-alertas:
    image: ${DOCKERLAB_USER:-j4cobiyo}/servicio-alertas:${IMAGE_TAG:-3.0.1}
    depends_on:
      oracle:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:8083:8083
    environment:
      ORACLE_JDBC_URL: ${ORACLE_JDBC_URL:-jdbc:oracle:thin:@oracle:1521/XEPDB1}
      ORACLE_USER: ${ORACLE_USER:-MEDIALERT}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-Medialert2026Demo}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-medialert}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-MedialertRabbit2026}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka1:29092,kafka2:29093,kafka3:29094}
    restart: unless-stopped
    networks:
    - medialert
  streaming-alertas:
    image: ${DOCKERLAB_USER:-j4cobiyo}/streaming-alertas:${IMAGE_TAG:-3.0.1}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:8084:8084
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka1:29092,kafka2:29093,kafka3:29094}
    restart: unless-stopped
    networks:
    - medialert
  bff-alertas:
    image: ${DOCKERLAB_USER:-j4cobiyo}/bff-alertas:${IMAGE_TAG:-3.0.1}
    depends_on:
      rabbitmq:
        condition: service_healthy
      servicio-alertas:
        condition: service_started
      streaming-alertas:
        condition: service_started
    ports:
    - 8080:8080
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-medialert}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-MedialertRabbit2026}
      ALERTAS_SERVICE_URL: http://servicio-alertas:8083
      STREAMING_SERVICE_URL: http://streaming-alertas:8084
      API_GATEWAY_SECRET: ${API_GATEWAY_SECRET:-CAMBIAR_POR_UN_VALOR_LARGO_Y_ALEATORIO}
      SECURITY_MODE: ${SECURITY_MODE:-GATEWAY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
    restart: unless-stopped
    networks:
    - medialert
volumes:
  oracle-data: {}
networks:
  medialert:
    driver: bridge
