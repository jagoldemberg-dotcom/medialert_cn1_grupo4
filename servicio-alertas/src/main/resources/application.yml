server:
  port: 8083
spring:
  application:
    name: servicio-alertas
  datasource:
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@oracle:1521/XEPDB1}
    username: ${ORACLE_USER:MEDIALERT}
    password: ${ORACLE_PASSWORD:Medialert2026Demo}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.dialect.OracleDialect
      hibernate.jdbc.time_zone: UTC
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:medialert}
    password: ${RABBITMQ_PASSWORD:MedialertRabbit2026}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka1:29092,kafka2:29093,kafka3:29094}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: cl.duoc.medialert.alertas.dto.AlertaKafkaLegacy
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
management.endpoints.web.exposure.include: health,info
medialert:
  rabbit:
    exchange: medialert.exchange
    signal-queue: cola.alertas.vitales
    signal-dlq: cola.alertas.vitales.dlq
    signal-routing-key: alertas.senales
    summary-queue: cola.resumen.vitales
    summary-dlq: cola.resumen.vitales.dlq
    summary-routing-key: alertas.resumenes
  kafka:
    alert-topic: alertas-medicas
    summary-topic: resumenes-vitales
